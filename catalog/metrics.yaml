# Meetwaardencatalogus van de Priva Bridge (implementatieplan v1.1, sectie 5).
#
# Versiebeheerd en de enige bron voor:
#   - welke Priva-labels de Bridge kent (een onbekend label/objecttype stopt de import van het bestand);
#   - welke labels bewust worden overgeslagen (alleen als ze leeg zijn of een bekende nepwaarde hebben);
#   - eenheid, niveau en aggregatie die de API meegeeft.
# Uitbreiden kan zonder codewijziging: voeg een metric of een `priva`-regel toe en herstart de app.
#
# Opgesteld tegen de echte exports Klimaat (week 46 2026) en Belichting (week 46 2025); zie DECISIONS.md.
#
# Velden per metric:
#   key            stabiele sleutel in de API (wijzigen = breaking change)
#   rapport        rapportfamilie waaruit de waarde komt
#   niveaus        afdeling | kap | bedrijf | een brontype (module, doek, doseerruimte, verwarming,
#                  groeilicht, kraan); `kap` bij een module-metric = optelling per kap (kap_rollup)
#   eenheid        eenheid in de API; `onbevestigd` = waarde ongewijzigd doorgegeven (open punt O7),
#                  `verwachte_eenheid` is dan alleen documentatie
#   aggregatie     mean | min | max | sum | time_weighted_mean (zoals Priva de dagwaarde levert)
#   status         gezien (in de echte export) | bevestigen (betekenis/eenheid nog bevestigen) |
#                  ontbreekt (nog in geen rapport) | afgeleid_vanaf_slice_2 (berekend door de Bridge)
#   plausibel      buiten dit bereik krijgt een waarde kwaliteit `verdacht` (waarde blijft bewaard)
#   max_dagduur    seconden per dag: meer dan de lengte van die lokale dag (23/24/25 uur) = `verdacht`
#   priva          regels label/type_1[/type_2/idx_2]; een rij past als alle opgegeven velden gelijk zijn

versie: 1
bron_types: {Afdeling: afdeling, modgroeilichtsturing: module, Groeilicht sturing: groeilicht, Autonoom doek: doek, CO2 doseerruimte: doseerruimte,
  Autonome verwarming: verwarming, Kraan: kraan}
