  kranen: {naam: Kranen, ondersteund_vanaf_slice: 2}
  algemeen_bedrijf: {naam: Algemeen Bedrijf, ondersteund_vanaf_slice: 2}
  algemeen_afdeling: {naam: Algemeen Afdeling, ondersteund_vanaf_slice: 2}
