[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "priva-bridge"
dynamic = ["version"]
description = "Lokale, alleen-lezen gegevensbron met Priva-dagwaarden voor de eigen tuinbouwapps"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn>=0.34,<0.35",
  "sqlalchemy>=2.0.40,<2.1",
  "alembic>=1.15,<1.16",
  "jinja2>=3.1.6,<3.2",
  "python-multipart>=0.0.20,<0.1",
  "pyyaml>=6.0.2,<7",
  "itsdangerous>=2.2,<2.3",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "httpx>=0.28,<0.29", "ruff==0.11.8"]

[project.scripts]
bridge = "bridge.cli:main"

[tool.setuptools.dynamic]
version = {attr = "bridge.__version__"}

[tool.setuptools.packages.find]
include = ["bridge*"]

[tool.setuptools.package-data]
bridge = ["templates/*.html", "migrations/*.py", "migrations/*.mako", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]
