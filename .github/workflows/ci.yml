name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check . && ruff format --check .
      - name: Tests (echte Priva-exports ontbreken in CI; die tests slaan over)
        run: python -m pytest -q
  docker:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Docker build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: priva-bridge:ci
      - name: Rooktest
        run: |
          docker run -d --name pb -e BRIDGE_ADMIN_PASSWORD=ci -p 8000:8000 priva-bridge:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/health | grep '"status":"ok"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/v1/status)" = 401
          docker exec pb bridge token aanmaken --naam ci --scope read:data | tail -1 > token
          curl -fsS -H "Authorization: Bearer $(cat token)" http://127.0.0.1:8000/api/v1/status
          docker rm -f pb
