name: Image publiceren
# ghcr.io/lvos04/priva-bridge
# - push naar een `ccr-*`-branch: tags `<versie>-rc`, `branch-<naam>` en `sha-<kort>`; nooit `latest`.
# - push naar de standaardbranch of een tag `v*`: `<versie>` en `latest`.
#   Een `ccr-*`-branch geeft nooit een release-tag, ook niet als hij (zoals bij een lege repository)
#   de standaardbranch is geworden.
# De versie komt uit één bron: bridge/__init__.py.
on:
  push:
    branches: ['ccr-*', main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Versie lezen
        id: versie
        run: echo "versie=$(python3 -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('bridge/__init__.py').read())[1])")" >> "$GITHUB_OUTPUT"
      - name: Soort build
        id: soort
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF_NAME" != ccr-* && "$GITHUB_REF" == "refs/heads/${{ github.event.repository.default_branch }}" ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/lvos04/priva-bridge
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ steps.versie.outputs.versie }},enable=${{ steps.soort.outputs.release == 'true' }}
            type=raw,value=latest,enable=${{ steps.soort.outputs.release == 'true' }}
            type=raw,value=${{ steps.versie.outputs.versie }}-rc,enable=${{ steps.soort.outputs.release != 'true' }}
            type=ref,event=branch,prefix=branch-,enable=${{ steps.soort.outputs.release != 'true' }}
            type=sha,prefix=sha-,format=short,enable=${{ steps.soort.outputs.release != 'true' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
